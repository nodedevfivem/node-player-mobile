name: Build Android APK (No Android Studio)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile NODE Player Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NODE-Player.apk

      - name: Upload NODE Player APK
        uses: actions/upload-artifact@v4
        with:
          name: NODE-Player-v0.1.2-TEST-APK
          path: dist/NODE-Player.apk
          if-no-files-found: error
          retention-days: 30
